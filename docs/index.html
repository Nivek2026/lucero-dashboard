<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucero ORB + FVG · Dashboard</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --text:#14181f; --muted:#667085; --line:#e4e7ec;
    --up:#16a34a; --down:#dc2626; --orb:#f59e0b; --tp:#0d9488; --warn-bg:#fff4e0; --warn-text:#8a4b00;
    --fvg-up:rgba(22,163,74,.18); --fvg-down:rgba(220,38,38,.18);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1116; --card:#171b22; --text:#e6e9ef; --muted:#8b93a1; --line:#262c36;
      --up:#34d399; --down:#f87171; --orb:#fbbf24; --tp:#2dd4bf; --warn-bg:#3a2a10; --warn-text:#fcd9a0;
      --fvg-up:rgba(52,211,153,.2); --fvg-down:rgba(248,113,113,.2);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:18px 20px 6px;max-width:1200px;margin:0 auto}
  h1{margin:0;font-size:20px}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .warn{max-width:1160px;margin:10px auto 0;padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn-text);font-size:13px}
  main{max-width:1200px;margin:0 auto;padding:14px 20px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(480px,1fr));gap:16px}
  @media (max-width:560px){main{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
  .name{font-weight:650;font-size:16px}
  .price{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--muted)}
  .pill.up{color:var(--up);border-color:var(--up)} .pill.down{color:var(--down);border-color:var(--down)}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:12px 0}
  .kv div{background:var(--bg);border-radius:10px;padding:8px 10px}
  .kv small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em}
  .kv b{font-variant-numeric:tabular-nums}
  .trade{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
  .trade.buy{border-left:4px solid var(--up)} .trade.sell{border-left:4px solid var(--down)}
  svg{width:100%;height:auto;display:block;margin:8px 0}
  h3{font-size:13px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  ul.ev{list-style:none;margin:0;padding:0;font-size:13.5px}
  ul.ev li{padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
  ul.ev li:last-child{border:none}
  .t{color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500}
  .muted{color:var(--muted)} .up{color:var(--up)} .down{color:var(--down)}
  .err{color:var(--down);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>Lucero ORB + FVG</h1>
  <div class="sub" id="sub">Cargando…</div>
</header>
<div class="warn">
  ⏱ <b>Datos con retraso:</b> la fuente gratuita (Yahoo Finance) entrega futuros CME con al menos ~10 minutos de demora.
  Úsalo para seguimiento y revisión; confirma siempre el precio en tu gráfico de TradingView antes de operar.
</div>
<main id="app"></main>

<script>
const fmt = n => (n==null||isNaN(n)) ? '–' : Number(n).toFixed(2);
let TZ = 2;
const hhmm = t => new Date((t + TZ*3600)*1000).toISOString().substr(11,5);
const dateTime = t => new Date((t + TZ*3600)*1000).toISOString().replace('T',' ').substr(0,16);

function chartSVG(day){
  const bars = day.bars || [];
  if(!bars.length) return '<p class="muted">Sin velas en esta sesión.</p>';
  const W=720,H=270,pl=8,pr=64,pt=10,pb=20, N=210;
  const entries = day.events.filter(e=>e.type==='ENTRY');
  const lastEntry = entries[entries.length-1];
  let vals = bars.flatMap(b=>[b.h,b.l]);
  [day.orb_high,day.orb_low].forEach(v=>v!=null&&vals.push(v));
  if(lastEntry) vals.push(lastEntry.sl,lastEntry.tp,lastEntry.entry);
  let lo=Math.min(...vals), hi=Math.max(...vals); const pad=(hi-lo)*0.05||1; lo-=pad; hi+=pad;
  const x = i => pl + (i+0.5)*(W-pl-pr)/N;
  const y = v => pt + (hi-v)*(H-pt-pb)/(hi-lo);
  const bw = Math.max(1.5, (W-pl-pr)/N*0.7);
  const idx = t => bars.findIndex(b=>b.t===t);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de velas de la sesión">`;
  // rejilla horaria
  for(let m=0;m<=210;m+=30){
    const xx = pl + m*(W-pl-pr)/N;
    s += `<line x1="${xx}" x2="${xx}" y1="${pt}" y2="${H-pb}" style="stroke:var(--line)"/>`;
    const lab = 9*60 + m; s += `<text x="${xx}" y="${H-5}" font-size="10" text-anchor="middle" style="fill:var(--muted)">${String(Math.floor(lab/60)).padStart(2,'0')}:${String(lab%60).padStart(2,'0')}</text>`;
  }
  // FVG activos
  (day.fvgs||[]).forEach(f=>{
    const i0 = Math.max(0, idx(f.t)), x0 = x(i0), x1 = x(bars.length-1)+bw;
    s += `<rect x="${x0}" y="${y(f.top)}" width="${x1-x0}" height="${Math.max(1,y(f.bot)-y(f.top))}" style="fill:${f.bull?'var(--fvg-up)':'var(--fvg-down)'}"/>`;
  });
  // ORB
  if(day.orb_high!=null){
    [[day.orb_high,'ORB H'],[day.orb_low,'ORB L']].forEach(([v,l])=>{
      s += `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke-dasharray="5 4" style="stroke:var(--orb)"/>`;
      s += `<text x="${W-pr+4}" y="${y(v)+4}" font-size="10" style="fill:var(--orb)">${l} ${fmt(v)}</text>`;
    });
  }
  // velas
  bars.forEach((b,i)=>{
    const up = b.c>=b.o, col = up?'var(--up)':'var(--down)', xx=x(i);
    s += `<line x1="${xx}" x2="${xx}" y1="${y(b.h)}" y2="${y(b.l)}" style="stroke:${col}"/>`;
    s += `<rect x="${xx-bw/2}" y="${y(Math.max(b.o,b.c))}" width="${bw}" height="${Math.max(1,Math.abs(y(b.o)-y(b.c)))}" style="fill:${col}"/>`;
  });
  // operación
  if(lastEntry){
    const i0 = Math.max(0, idx(lastEntry.t)), x0 = x(i0);
    [[lastEntry.entry,'Entrada','var(--muted)'],[lastEntry.sl,'SL','var(--down)'],[lastEntry.tp,'TP','var(--tp)']].forEach(([v,l,c])=>{
      s += `<line x1="${x0}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke-dasharray="${l==='Entrada'?'2 3':'6 3'}" stroke-width="1.5" style="stroke:${c}"/>`;
      s += `<text x="${W-pr+4}" y="${y(v)+4}" font-size="10" style="fill:${c}">${l} ${fmt(v)}</text>`;
    });
  }
  // marcas de eventos
  day.events.forEach(e=>{
    const i = idx(e.t); if(i<0) return; const xx=x(i);
    if(e.type==='ORB_BREAK'){
      const up = e.side==='UP';
      s += `<text x="${xx}" y="${up?y(bars[i].h)-6:y(bars[i].l)+14}" font-size="13" text-anchor="middle" style="fill:var(--orb)">${up?'▲':'▼'}</text>`;
    } else if(e.type==='ENTRY'){
      const buy = e.side==='BUY';
      s += `<text x="${xx}" y="${buy?y(bars[i].l)+22:y(bars[i].h)-12}" font-size="11" font-weight="700" text-anchor="middle" style="fill:${buy?'var(--up)':'var(--down)'}">${buy?'COMPRA':'VENTA'}</text>`;
    }
  });
  return s + '</svg>';
}

function evLabel(e){
  switch(e.type){
    case 'ORB_BREAK': return `<b>${e.side==='UP'?'🔔⬆️ Cierre por encima del ORB':'🔔⬇️ Cierre por debajo del ORB'}</b> · cierre ${fmt(e.price)}`;
    case 'ENTRY': return `<b class="${e.side==='BUY'?'up':'down'}">${e.side==='BUY'?'🟢 COMPRA':'🔴 VENTA'}</b> · entrada ${fmt(e.entry)} · SL ${fmt(e.sl)} · TP ${fmt(e.tp)}`;
    case 'TP': return `<b class="up">✅ TP alcanzado</b> · ${fmt(e.price)}`;
    case 'SL': return `<b class="down">❌ SL tocado</b> · ${fmt(e.price)}`;
  }
  return e.type;
}

function resultOf(events){
  const en = events.filter(e=>e.type==='ENTRY');
  if(!en.length) return '<span class="muted">sin entrada</span>';
  return en.map(e=> e.result==='TP' ? `<span class="up">TP +${e.rr}R</span>` : e.result==='SL' ? '<span class="down">SL −1R</span>' : 'abierta').join(' · ');
}

function card(code, s){
  if(!s.today) return `<section class="card"><div class="name">${s.name||code}</div><p class="err">${s.error||'Sin datos todavía.'}</p></section>`;
  const d = s.today;
  const biasTxt = d.bias===1 ? 'ALCISTA' : d.bias===-1 ? 'BAJISTA' : 'NEUTRO';
  const biasCls = d.bias===1 ? 'up' : d.bias===-1 ? 'down' : '';
  const entries = d.events.filter(e=>e.type==='ENTRY');
  const le = entries[entries.length-1];
  let trade = '';
  if(le){
    trade = `<div class="trade ${le.side==='BUY'?'buy':'sell'}">
      <b>${le.side==='BUY'?'COMPRA':'VENTA'}</b> · ${hhmm(le.t)} ·
      Entrada <b>${fmt(le.entry)}</b> · SL <b>${fmt(le.sl)}</b> · TP <b>${fmt(le.tp)}</b> · R:R 1:${le.rr}
      <div class="muted" style="margin-top:4px">Resultado: ${resultOf([le])}</div></div>`;
  }
  const evs = d.events.length
    ? '<ul class="ev">' + d.events.slice().reverse().map(e=>`<li><span class="t">${hhmm(e.t)}</span><span>${evLabel(e)}</span></li>`).join('') + '</ul>'
    : '<p class="muted" style="margin:0">Sin eventos en esta sesión.</p>';
  const hist = (s.history||[]).length
    ? `<table><tr><th>Sesión</th><th>Sesgo</th><th>ORB</th><th>Resultado</th></tr>` +
      s.history.map(h=>`<tr><td>${h.date}</td><td class="${h.bias===1?'up':h.bias===-1?'down':''}">${h.bias===1?'Alcista':h.bias===-1?'Bajista':'–'}</td><td>${fmt(h.orb_low)} – ${fmt(h.orb_high)}</td><td>${resultOf(h.events)}</td></tr>`).join('') + '</table>'
    : '<p class="muted" style="margin:0">Sin historial.</p>';
  return `<section class="card">
    <div class="top">
      <div><div class="name">${s.name}</div><span class="pill ${biasCls}">${d.status}</span></div>
      <div style="text-align:right"><div class="price">${fmt(s.last_price)}</div>
        <div class="muted" style="font-size:12px">última vela ${hhmm(s.last_bar_t)} · hace ${s.data_age_min} min</div></div>
    </div>
    <div class="kv">
      <div><small>Sesgo</small><b class="${biasCls}">${biasTxt}</b></div>
      <div><small>ORB High</small><b>${fmt(d.orb_high)}</b></div>
      <div><small>ORB Low</small><b>${fmt(d.orb_low)}</b></div>
      <div><small>FVG activos</small><b>${(d.fvgs||[]).length}</b></div>
    </div>
    ${trade}
    ${chartSVG(d)}
    <h3>Eventos de hoy · ${d.date}</h3>${evs}
    <h3>Sesiones anteriores</h3>${hist}
    ${s.error?`<p class="err">Último intento falló: ${s.error} (se muestran los datos anteriores)</p>`:''}
  </section>`;
}

async function load(){
  try{
    const r = await fetch('data/state.json?t=' + Date.now(), {cache:'no-store'});
    const st = await r.json();
    TZ = st.tz_offset ?? 2;
    const codes = Object.keys(st.symbols||{});
    document.getElementById('sub').textContent = st.updated
      ? `Actualizado ${dateTime(st.updated)} (UTC+${TZ}) · sesión ${st.session} · se refresca solo cada minuto`
      : 'Aún no hay datos: ejecuta el workflow una vez en GitHub Actions.';
    document.getElementById('app').innerHTML = codes.length
      ? codes.map(c=>card(c, st.symbols[c])).join('')
      : '<section class="card"><p class="muted">Sin datos todavía.</p></section>';
  }catch(e){
    document.getElementById('sub').textContent = 'No se pudo leer data/state.json';
  }
}
load(); setInterval(load, 60000);
</script>
</body>
</html>
