name: Escaneo ORB + FVG

on:
  schedule:
    # Se despierta cada 5 min; el propio motor decide si está dentro de tu horario (config.json)
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lucero-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar horario
        id: gate
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python3 engine.py --gate >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Ejecutar motor
        if: steps.gate.outputs.run == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python engine.py

      - name: Guardar estado
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name  "lucero-bot"
          git config user.email "lucero-bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || (git commit -m "estado $(date -u +%H:%M)" && git pull --rebase && git push)
