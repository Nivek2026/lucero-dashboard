name: Escaneo ORB + FVG

on:
  schedule:
    - cron: "*/5 6-10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lucero-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ejecutar motor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python engine.py

      - name: Guardar estado
        run: |
          git config user.name  "lucero-bot"
          git config user.email "lucero-bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || (git commit -m "estado $(date -u +%H:%M)" && git pull --rebase && git push)
